<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>404 Halaman Tidak Ditemukan | Aditya Dwi Ferdiansyah</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Work+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="light-theme">
    <main class="error-page-section">
      <div class="error-page-content">
        <h1 class="error-code">404</h1>
        <h2 class="error-title">Halaman Tidak Ditemukan</h2>
        <p class="error-description">
          Ups! Halaman yang Anda cari tidak ditemukan. Mungkin alamat URL salah diketik, atau halaman telah dipindahkan.
        </p>
        <a href="/" class="btn btn-primary clicky-interactive" style="text-decoration: none;">
          <i data-lucide="arrow-left"></i> Kembali ke Beranda
        </a>
      </div>
    </main>

    <script type="module">
      import './src/style.css';

      if (window.lucide) {
        window.lucide.createIcons();
      }

      const savedTheme = localStorage.getItem('theme') || 'light';
      if (savedTheme === 'dark') {
        document.body.classList.remove('light-theme');
        document.body.classList.add('dark-theme');
      } else {
        document.body.classList.remove('dark-theme');
        document.body.classList.add('light-theme');
      }
    </script>
  </body>
</html>
